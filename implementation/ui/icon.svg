<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VoxLogicA">
  <!-- The mark is the thing the application is: a lattice of cells, with the
       region that satisfies the formula filled in. Four cells because that is
       the smallest grid that still reads as a grid, and the filled one is the
       accent so the icon says "selection" at 16 pixels, which is the only size
       anybody will ever see it at. -->
  <rect width="32" height="32" rx="7" fill="#0f1115" />
  <g fill="none" stroke="#8b93a7" stroke-width="2.1" stroke-linejoin="round">
    <rect x="6.5" y="6.5" width="8.5" height="8.5" rx="2" />
    <rect x="17" y="17" width="8.5" height="8.5" rx="2" />
    <rect x="6.5" y="17" width="8.5" height="8.5" rx="2" />
  </g>
  <rect x="17" y="6.5" width="8.5" height="8.5" rx="2" fill="#4c8dff" />
</svg>
